<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>SNAKE 1-BIT</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 8 8'%3E%3Crect width='8' height='8'/%3E%3Cpath fill='%23fff' d='M1 1h6v2H3v1h4v3H1V5h4V4H1z' shape-rendering='crispEdges'/%3E%3C/svg%3E" />
    <style>
      html, body {
        margin: 0; height: 100%; background: #000; overflow: hidden;
        touch-action: none; user-select: none; -webkit-user-select: none;
      }
      body {
        display: flex; flex-direction: column;
        align-items: center; justify-content: center;
      }
      #game { image-rendering: pixelated; }
      #game canvas { image-rendering: pixelated; display: block; }
      #credit {
        box-sizing: border-box; max-width: 100vw; padding: 8px 12px 10px;
        color: #fff; text-align: center;
        font: 11px/1.5 ui-monospace, Menlo, Consolas, monospace;
      }
      #credit p { margin: 0; }
      #credit .by { font-weight: bold; }
    </style>
  </head>
  <body>
    <div id="game"></div>
    <footer id="credit">
      <p class="by">Made with Sonnet 5.5</p>
      <p>"Using phaserjs and phatty ecs system, buatkan sebuah game snake 1 bit yang bisa dimainkan di browser"</p>
    </footer>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
